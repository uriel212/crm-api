spring.datasource.url=jdbc:mysql://localhost:3306/crm_ventas?connectionTimeZone=America/Guatemala
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Solo para desarrollo local. En produccion se usa la variable de entorno JWT_SECRET.
app.jwt.secreto=${JWT_SECRET:secreto-local-de-desarrollo-crm-ventas-2026-no-usar-en-prod}
