spring.application.name=crm-api
spring.profiles.default=dev

# Zona horaria del negocio (Guatemala). Se usa en JVM, Jackson, Hibernate y en el Clock de la app.
app.zona-horaria=America/Guatemala
spring.jackson.time-zone=America/Guatemala
spring.jpa.properties.hibernate.jdbc.time_zone=America/Guatemala

# El esquema lo maneja Flyway; Hibernate solo valida que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

# JWT (HS256). El secreto llega por variable de entorno JWT_SECRET (minimo 32 caracteres).
app.jwt.secreto=${JWT_SECRET}
app.jwt.expiracion-minutos=480

# Swagger UI disponible en todos los perfiles (P26); se autentica con el boton Authorize.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
